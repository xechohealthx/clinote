directories:
  output: dist-electron
  buildResources: build
appId: com.clinote.app
productName: Clinote
copyright: © 2024 Clinote Team. All rights reserved.
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - node_modules/**/*
      - package.json
extraMetadata:
  main: electron/main.cjs
mac:
  category: public.app-category.medical
  icon: electron/assets/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/assets/entitlements.mac.plist
  entitlementsInherit: electron/assets/entitlements.mac.plist
  darkModeSupport: true
  type: distribution
win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  publisherName: Clinote Team
  requestedExecutionLevel: asInvoker
linux:
  icon: electron/assets/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Medical
  desktop:
    Name: Clinote
    Comment: Professional medical transcription desktop application
    Keywords: medical;transcription;healthcare;notes
    StartupWMClass: Clinote
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Clinote
  installerIcon: electron/assets/icon.ico
  uninstallerIcon: electron/assets/icon.ico
  installerHeaderIcon: electron/assets/icon.ico
  deleteAppDataOnUninstall: true
dmg:
  title: Clinote Installer
  icon: electron/assets/icon.icns
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      'y': 220
      type: file
    - x: 410
      'y': 220
      type: link
      path: /Applications
  background: null
  format: ULFO
electronVersion: 32.3.3
